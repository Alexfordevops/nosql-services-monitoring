# Modo de implantação
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: standard   # usa StorageClass do Minikube
    size: 10Gi                   # ajuste do tamanho
    path: /var/loki               # caminho dentro do container já montado pelo PVC
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

loki:
  limits_config:
    allow_structured_metadata: false

  auth_enabled: false

  server:
    http_listen_port: 3100

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  schemaConfig:
    configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          period: 24h
          prefix: loki_index_
