<form [formGroup]="messageForm" (ngSubmit)="onSubmit()" class="message-form">
  <h3>Criar Mensagem</h3>

  <!-- Nome -->
  <div class="form-group">
    <label for="name">Nome</label>
    <input
      id="name"
      type="text"
      formControlName="name"
      placeholder="Digite seu nome"
    />
    <div class="error" *ngIf="messageForm.get('name')?.invalid && messageForm.get('name')?.touched">
      O nome é obrigatório (mínimo 2 caracteres).
    </div>
  </div>

  <!-- Mensagem -->
  <div class="form-group">
    <label for="message">Mensagem</label>
    <textarea
      id="message"
      rows="4"
      formControlName="message"
      placeholder="Digite sua mensagem"
    ></textarea>
    <div class="error" *ngIf="messageForm.get('message')?.invalid && messageForm.get('message')?.touched">
      A mensagem é obrigatória (mínimo 3 caracteres).
    </div>
  </div>

  <!-- Feedback -->
  <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
  <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <!-- Botão -->
  <button type="submit" [disabled]="messageForm.invalid" class="btn-primary">
    Enviar
  </button>
</form>
