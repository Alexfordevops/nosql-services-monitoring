apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-app-deployment
  namespace: nosql
  labels:
    app: angular-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-app
  template:
    metadata:
      labels:
        app: angular-app
    spec:
      containers:
      - name: angular-app
        image: angular-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
